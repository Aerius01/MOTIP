SUPER_CONFIG_PATH:          # super (father) config path

# Seed:
SEED: 42

# System Settings:
NUM_WORKERS: 15              # Reduced for 8GB GPU
PREFETCH_FACTOR: 4          # Reduced for 8GB GPU
DEVICE: cuda

# Data settings:
# 1. paths:
DATA_ROOT: ./datasets/
DATASETS: [OceanFish]
DATASET_SPLITS: [train]
# 2. sampling:
SAMPLE_STEPS: [0, ]
SAMPLE_LENGTHS: [20, ]        # Match BFT for compatible REL_PE_LENGTH
SAMPLE_INTERVALS: [3, ]       # 20×3=60 frames span ≈ 4 seconds at 15fps
LENGTH_PER_ITERATION:         # how many frames to process per iteration, the sample length should be divisible by this number

# Data augmentation settings:
# 1. image sizes:
AUG_RESIZE_SCALES: [480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800]
AUG_MAX_SIZE: 1440
AUG_RANDOM_RESIZE: [400, 500, 600]
AUG_RANDOM_CROP_MIN: 384
AUG_RANDOM_CROP_MAX: 600
# 2. random shift:
AUG_MAX_SHIFT_RATIO: 0.06
# 3. bounding box overflow:
AUG_OVERFLOW_BBOX: False
# 4. color jitter (important for ocean scenes with varying lighting):
AUG_BRIGHTNESS: 0.5           # Increased for underwater lighting variation
AUG_CONTRAST: 0.5             # Increased for ocean contrast variation
AUG_SATURATION: 0.4
AUG_HUE: 0.2
AUG_COLOR_JITTER_V2: False
# 5. for id binding:
AUG_NUM_GROUPS: 3  # Reduced from 6 for faster fine-tuning (pretrained model needs less augmentation)
AUG_TRAJECTORY_OCCLUSION_PROB: 0.5
AUG_TRAJECTORY_SWITCH_PROB: 0.5

# Model settings:
# MOTIP:
ONLY_DETR: False
NUM_CLASSES: 6                # Multi-class: each fish type gets its own class (class head randomly initialized)
NUM_ID_VOCABULARY: 50         # Matches BFT pretrain
DETR_FRAMEWORK: deformable_detr
FEATURE_DIM: 256
FFN_DIM_RATIO: 2
ID_DIM: 256
HEAD_DIM: 32
NUM_ID_DECODER_LAYERS: 6
ID_LOSS_WEIGHT: 1.0
REL_PE_LENGTH: 20             # Match BFT pretrain checkpoint
USE_AUX_LOSS: False
USE_SHARED_AUX_HEAD: True
USE_FOCAL_LOSS: False
# About DETR Framework:
BACKBONE: resnet50
DILATION: False
DETR_NUM_QUERIES: 300
DETR_NUM_FEATURE_LEVELS: 4
DETR_AUX_LOSS: True
DETR_WITH_BOX_REFINE: True
DETR_TWO_STAGE: False
DETR_HIDDEN_DIM: 256
DETR_MASKS: False
DETR_POSITION_EMBEDDING: sine
DETR_NUM_HEADS: 8
DETR_ENC_LAYERS: 6
DETR_DEC_LAYERS: 6
DETR_DIM_FEEDFORWARD: 1024
DETR_DROPOUT: 0.0
DETR_DEC_N_POINTS: 4
DETR_ENC_N_POINTS: 4
DETR_CLS_LOSS_COEF: 2.0
DETR_BBOX_LOSS_COEF: 5.0
DETR_GIOU_LOSS_COEF: 2.0
DETR_FOCAL_ALPHA: 0.25
DETR_SET_COST_CLASS: 2.0
DETR_SET_COST_BBOX: 5.0
DETR_SET_COST_GIOU: 2.0
DETR_CRITERION_BATCH_LEN: 10

# Training strategies:
BATCH_SIZE: 1
LR: 1.0e-4
LR_BACKBONE_NAMES: [backbone.0]
LR_BACKBONE_SCALE: 0.1
LR_LINEAR_PROJ_NAMES: [reference_points, sampling_offsets]
LR_LINEAR_PROJ_SCALE: 0.05
LR_DICTIONARY_NAMES: [word_to_embed, embed_to_word]
LR_DICTIONARY_SCALE: 1.0
WEIGHT_DECAY: 0.0005
MAX_CLIP_NORM: 0.1
EPOCHS: 50                    # Upper bound; early stopping will terminate before this in practice
SCHEDULER_MILESTONES: [35, 45] # LR drops at 70% and 90% of the epoch ceiling
SCHEDULER_GAMMA: 0.1
LR_WARMUP_EPOCHS: 2
DETR_NUM_TRAIN_FRAMES: 4
DETR_NUM_CHECKPOINT_FRAMES: 1      # Gradient checkpointing for 8GB GPU (reduces memory usage)
USE_DECODER_CHECKPOINT: False
ACCUMULATE_STEPS: 1
SEPARATE_CLIP_NORM: True
USE_ACCELERATE_CLIP_NORM: True

# Resumes and Pretrains:
DETR_PRETRAIN: ./pretrains/r50_deformable_detr_coco.pth
# Per-class COCO initialisation indices for the class head (length must equal NUM_CLASSES).
# COCO id 1 = person, COCO id 16 = bird.
# This runs FIRST and seeds the class head from COCO weights.
# OceanFish class mapping: 0=marlin, 1=sealion, 2=baitball, 3=human, 4=bird, 5=mahi
DETR_CLASS_INIT_IDXS: [16, 16, 16, 1, 16, 16]
# Per-class indices into the oceanfish_pretrain class head (5 classes):
#   pretrain class 0 = fish (MFT25)
#   pretrain class 1 = swimmer (SeaDronesSee)
#   pretrain class 2 = swimmer+lifejacket (SeaDronesSee)
#   pretrain class 3 = boat (SeaDronesSee)
#   pretrain class 4 = life jacket (SeaDronesSee)
# -1 = keep the COCO row already loaded by DETR_CLASS_INIT_IDXS above.
# Mapping: marlin=fish(0), sealion=fish(0,+noise), baitball=fish(0,+noise),
#          human=swimmer(1), bird=COCO bird(16,-1), mahi=fish(0,+noise)
CHECKPOINT_CLASS_INIT_IDXS: [0, 0, 0, 1, -1, 0]
RESUME_MODEL: ./pretrains/MFT_SeaDroneSee_pretrain.pth
RESUME_OPTIMIZER: False
RESUME_SCHEDULER: False
RESUME_STATES: False

# Inference settings:
INFERENCE_MODEL:            # the model path for inference
INFERENCE_DATASET: OceanFish
INFERENCE_SPLIT:            # set to e.g. fold0/val when running K-fold
INFERENCE_MODE: evaluate    # evaluate or submit
INFERENCE_GROUP: default    # group name for inference
INFERENCE_MAX_LONGER: 1440  # max longer size for inference
INFERENCE_DTYPE: FP32
ASSIGNMENT_PROTOCOL: object-max
MISS_TOLERANCE: 18          # Must be <= REL_PE_LENGTH - 2 (18 <= 20-2)
DET_THRESH: 0.3
NEWBORN_THRESH: 0.6
ID_THRESH: 0.2
AREA_THRESH: 0
INFERENCE_ONLY_DETR: False  # MUST use ID prediction network!

# Outputs settings:
OUTPUTS_DIR:                # outputs directory
USE_WANDB: False            # use wandb or not
EXP_OWNER: oceanfish
EXP_PROJECT: MOTIP
EXP_GROUP:
EXP_NAME:
GIT_VERSION:
SAVE_CHECKPOINT_PER_EPOCH: 2  # Evaluate val and checkpoint every 2 epochs
MULTI_LAST_CHECKPOINTS: 0

# Early stopping (patience-based, monitors val HOTA):
# Training stops when val HOTA does not improve by MIN_DELTA for PATIENCE consecutive
# eval periods. Set PATIENCE to null to disable (run for full EPOCHS count instead).
# Best checkpoint is saved to checkpoint_best.pth whenever val improves.
EARLY_STOPPING_PATIENCE: 7   # 7 × 2 = 14 epochs without improvement → stop
EARLY_STOPPING_METRIC: HOTA
EARLY_STOPPING_MIN_DELTA: 0.001

# For previous version of MOTIP checkpoints:
USE_PREVIOUS_CHECKPOINT: False
